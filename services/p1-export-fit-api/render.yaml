services:
  - type: web
    name: marketgate-api
    env: python
    runtime: python3
    region: singapore
    rootDir: services/p1-export-fit-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # 결제 멱등 잠금이 인프로세스라 멀티워커에서는 무효 (docs/LESSONS.md L014).
      # order_id DB unique index 도입 전까지 워커 1 유지.
      - key: UVICORN_WORKERS
        value: "1"
    healthCheckPath: /health
    autoDeploy: true
