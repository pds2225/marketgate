services:
  - type: web
    name: marketgate-api
    env: python
    runtime: python3
    region: singapore
    rootDir: services/p1-export-fit-api
    buildCommand: pip install -r requirements.txt && python -m app.run_migrations
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # 결제 멱등 잠금이 인프로세스라 멀티워커에서는 무효 (docs/LESSONS.md L014).
      # order_id DB unique index 도입 전까지 워커 1 유지.
      - key: UVICORN_WORKERS
        value: "1"
      - key: APP_ENV
        value: production
      # 값은 Render 대시보드에서만 설정한다 (리포지토리에 커밋 금지).
      # 미설정 상태로 배포하면 기동 시 하드 실패한다.
      # Render 기반 CI/프리뷰에서 pytest 를 돌릴 때도 더미 값이 필요하다 (없으면 수집 단계에서 실패).
      - key: JWT_SECRET
        sync: false

    healthCheckPath: /health
    autoDeploy: true
