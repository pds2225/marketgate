<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketGate</title>

    <!--
      웹폰트는 렌더를 막지 않게 불러온다.
      이전에는 index.css 와 3개 화면의 <style> 안에서 @import 로 불러왔는데,
      @import 는 CSS 를 받아 파싱한 뒤에야 폰트 요청을 시작하는 직렬 방식이라
      fonts.googleapis.com 이 느리거나 막힌 망에서는 화면이 그동안 비어 있었다
      (실측: 폰트 서버에 못 닿는 환경에서 랜딩 렌더 13.0초 / 차단 시 0.3초).

      media="print" 로 받아서 onload 에 media 를 all 로 바꾸는 방식이라
      스타일시트가 렌더를 막지 않는다. 폰트가 늦거나 실패해도 본문은 즉시 뜨고,
      display=swap 이 붙어 있어 대체 글꼴로 먼저 그려진다.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
