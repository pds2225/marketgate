<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketGate 목표 성과</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #FFFFFF; color: #1e3a5f; font-family: 'DM Sans', 'Malgun Gothic', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
.card {
  width: 960px;
  background: #FFFFFF;
  border: 1px solid #d0dce8;
  border-radius: 8px;
  padding: 48px 56px;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(90deg, #1e3a5f, #3b82f6);
}
.badge { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 0.15em; color: #3b82f6; text-transform: uppercase; }
.title { font-size: 1.8rem; font-weight: 700; color: #1e3a5f; margin-top: 12px; margin-bottom: 32px; }
.divider { height: 1px; background: #e2e8f0; margin: 0 0 32px 0; }
.section-title { font-family: 'DM Mono', monospace; font-size: 0.7rem; letter-spacing: 0.1em; color: #3b82f6; text-transform: uppercase; margin-bottom: 20px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 36px; }
.metric {
  background: #f0f5ff;
  border: 1px solid #d0dce8;
  border-radius: 6px;
  padding: 20px 14px;
  text-align: center;
  position: relative;
}
.metric-icon { font-size: 1.6rem; margin-bottom: 8px; }
.metric-value { font-family: 'DM Mono', monospace; font-size: 1.4rem; font-weight: 500; color: #1e3a5f; }
.metric-label { font-size: 0.7rem; color: #64748b; margin-top: 4px; line-height: 1.4; }
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.compare-card {
  background: #f0f5ff;
  border: 1px solid #d0dce8;
  border-radius: 6px;
  padding: 28px 24px;
}
.compare-title { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em; color: #64748b; text-transform: uppercase; margin-bottom: 16px; }
.compare-flow { display: flex; align-items: center; justify-content: center; gap: 16px; }
.compare-from { font-family: 'DM Mono', monospace; font-size: 1.1rem; color: #94a3b8; text-decoration: line-through; }
.compare-arrow { font-size: 1.4rem; color: #3b82f6; }
.compare-to { font-family: 'DM Mono', monospace; font-size: 1.6rem; font-weight: 700; color: #1e3a5f; }
.compare-note { font-size: 0.65rem; color: #94a3b8; margin-top: 8px; text-align: center; }
.footer { margin-top: 32px; padding-top: 16px; border-top: 1px solid #e2e8f0; }
.footer-text { font-family: 'DM Mono', monospace; font-size: 0.55rem; color: #94a3b8; letter-spacing: 0.08em; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">MARKETGATE · Export Intelligence Platform</div>
  <div class="title">목표 성과 & 기대효과</div>
  <div class="divider"></div>

  <div class="section-title">목표 성과</div>
  <div class="grid">
    <div class="metric">
      <div class="metric-icon">🏢</div>
      <div class="metric-value">10</div>
      <div class="metric-label">파일럿 테스트<br>기업 10개사</div>
    </div>
    <div class="metric">
      <div class="metric-icon">🤝</div>
      <div class="metric-value">1</div>
      <div class="metric-label">유료 고객<br>1개사 확보</div>
    </div>
    <div class="metric">
      <div class="metric-icon">💰</div>
      <div class="metric-value">600만</div>
      <div class="metric-label">매출<br>600만 원</div>
    </div>
    <div class="metric">
      <div class="metric-icon">📜</div>
      <div class="metric-value">2건</div>
      <div class="metric-label">특허 출원<br>2건</div>
    </div>
    <div class="metric">
      <div class="metric-icon">™️</div>
      <div class="metric-value">1건</div>
      <div class="metric-label">상표 출원<br>1건</div>
    </div>
  </div>

  <div class="section-title">기대효과</div>
  <div class="compare-grid">
    <div class="compare-card">
      <div class="compare-title">바이어 발굴 시간</div>
      <div class="compare-flow">
        <span class="compare-from">5주</span>
        <span class="compare-arrow">→</span>
        <span class="compare-to">5분</span>
      </div>
      <div class="compare-note">시간 단축률 99.9%</div>
    </div>
    <div class="compare-card">
      <div class="compare-title">비용 (바이어 10명 기준)</div>
      <div class="compare-flow">
        <span class="compare-from">2,000만원</span>
        <span class="compare-arrow">→</span>
        <span class="compare-to">99만원</span>
      </div>
      <div class="compare-note">비용 절감률 95%</div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-text">MARKETGATE · AI 기반 수출 바이어 적합성 분석 플랫폼 · marketgate.vercel.app</div>
  </div>
</div>
</body>
</html>
